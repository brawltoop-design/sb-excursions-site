<text x="32" y="356" font-size="13" font-weight="600" fill="#C2410C">Контент операторов разносит в 3,6 раза лучше блогерского. Операторов в выдаче 13 из 436.</text>
<text x="32" y="384" font-size="11" fill="#6B7280">Каналы с числом подписчиков меньше 100 исключены, чтобы не ловить выбросы</text>
