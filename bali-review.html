<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leave a review — SB Excursions</title>
  <meta name="description" content="Share your SB Excursions Bali tour experience — your review goes straight to our WhatsApp.">
  <meta name="robots" content="noindex, follow">
  <link rel="stylesheet" href="/css/fonts-manrope.css?v=d25c80b9">
  <style>
    :root { --ink:#191919; --soft:#6d6d6d; --blue:#2f6bff; --gold:#E8B23A; --border:rgba(21,21,21,0.08); }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Manrope',-apple-system,'Segoe UI',Roboto,sans-serif; color:var(--ink); background:#fff; line-height:1.5; }
    .head { display:flex; align-items:center; justify-content:space-between; padding:14px 24px; border-bottom:1px solid var(--border); }
    .head img { height:38px; display:block; }
    .head a.wa { border-radius:999px; background:var(--ink); color:#fff; text-decoration:none; font-size:14px; font-weight:500; padding:9px 20px; }
    .wrap { max-width:640px; margin:0 auto; padding:40px 20px 70px; }
    h1 { font-size:30px; font-weight:500; letter-spacing:-0.01em; margin-bottom:8px; }
    .sub { font-size:15px; color:var(--soft); margin-bottom:26px; }
    .label { display:block; font-size:12.5px; font-weight:600; margin:16px 0 6px; }
    select, input, textarea { width:100%; font-family:inherit; font-size:14.5px; color:var(--ink); border:1px solid rgba(21,21,21,0.16); border-radius:12px; padding:12px 15px; background:#fff; }
    select:focus, input:focus, textarea:focus { border-color:var(--blue); outline:none; }
    textarea { min-height:130px; resize:vertical; }
    .row { display:flex; gap:12px; } .row > div { flex:1; }
    .stars { display:flex; gap:6px; }
    .star { font-size:34px; line-height:1; background:none; border:none; cursor:pointer; color:#d9d9d9; padding:2px; transition:transform .15s ease, color .15s ease; }
    .star.on { color:var(--gold); } .star:hover { transform:scale(1.15); }
    .send { display:inline-flex; align-items:center; gap:9px; margin-top:22px; border-radius:999px; border:none; background:var(--ink); color:#fff; font-size:15.5px; font-weight:500; padding:15px 30px; cursor:pointer; font-family:inherit; transition:background .25s ease, transform .25s ease; }
    .send:hover { background:var(--blue); transform:translateY(-2px); }
    .note { font-size:13.5px; color:var(--soft); margin-top:14px; }
    @media (max-width:560px){ .row{flex-direction:column;gap:0;} h1{font-size:25px;} }
  </style>
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script type="application/ld+json">
{
  "@type": "TravelAgency",
  "@id": "https://www.sbexcursion.com/#organization",
  "name": "SB Excursions",
  "url": "https://www.sbexcursion.com",
  "description": "Private guided day tours across Bali and the Nusa islands, booked directly over WhatsApp.",
  "areaServed": {
    "@type": "Place",
    "name": "Bali, Indonesia"
  },
  "address": {
    "@type": "PostalAddress",
    "streetAddress": "Jl. Petitenget",
    "addressLocality": "Seminyak",
    "addressRegion": "Bali",
    "addressCountry": "ID"
  },
  "priceRange": "$15-$150",
  "telephone": "+62 853 3368 5020",
  "logo": {
    "@type": "ImageObject",
    "url": "https://www.sbexcursion.com/images/tild6536-3637-4563-a362-633234333130__favikon_sb_excursion.png"
  },
  "sameAs": [
    "https://www.tripadvisor.com/Attraction_Review-g469404-d34593301-Reviews-SB_Excursions-Seminyak_Kuta_District_Badung_Regency_Bali.html",
    "https://www.trustpilot.com/review/sbexcursion.com",
    "https://www.instagram.com/dubai_sb_excursions",

  ],
  "contactPoint": {
    "@type": "ContactPoint",

    "telephone": "+62 853 3368 5020",
    "url": "https://wa.me/6285333685020",

      "English",

</head>
<body>
  <header class="head">
    <a href="/bali/en/main-page"><img src="/images/tild3334-6466-4436-b766-376338363935__sb_excursions_dubai_.png" alt="SB Excursions"></a>
    <a class="wa" href="https://wa.me/6285333685020" target="_blank" rel="noopener">WhatsApp</a>
  </header>
  <main class="wrap">
    <h1 id="tTitle"></h1>
    <p class="sub" id="tSub"></p>

    <span class="label" id="tTour"></span>
    <select id="fTour"></select>

    <span class="label" id="tRating"></span>
    <div class="stars" id="fStars">
      <button type="button" class="star on" data-v="1">★</button>
      <button type="button" class="star on" data-v="2">★</button>
      <button type="button" class="star on" data-v="3">★</button>
      <button type="button" class="star on" data-v="4">★</button>
      <button type="button" class="star on" data-v="5">★</button>
    </div>

    <div class="row">
      <div><label class="label" for="fName" id="tName"></label><input id="fName" type="text" autocomplete="name"></div>
      <div><label class="label" for="fCountry" id="tCountry"></label><input id="fCountry" type="text" autocomplete="country-name"></div>
    </div>

    <label class="label" for="fText" id="tReview"></label>
    <textarea id="fText"></textarea>

    <button type="button" class="send" id="fSend"></button>
    <p class="note" id="tNote"></p>
    <p class="note" id="tPrivacy"></p>
  </main>

  <script src="/ai-planner/js/data.js"></script>
  <script>
    (function () {
      var I18N = {
        en: { title: "How was your Bali day with us?", sub: "Thank you for travelling with SB Excursions! Leave a short review — it goes straight to our WhatsApp, and you can attach your photos right in the chat.", tour: "Which tour did you join?", other: "Other / don’t remember", rating: "Your rating", name: "Your name", country: "Country", review: "Your review", placeholder: "Tell us about your day…", btn: "Send review via WhatsApp", note: "📷 Got photos from the tour? Attach them in WhatsApp after sending — we love seeing them!", needText: "Please write a couple of words and your name first :)", privacy: "By sending, your review goes to our WhatsApp chat — details aren't shared anywhere else.", privacyLink: "Privacy Policy" },
        ru: { title: "Как прошёл ваш день на Бали с нами?", sub: "Спасибо, что путешествовали с SB Excursions! Оставьте короткий отзыв — он улетит прямо в наш WhatsApp, а фото можно прикрепить там же в чате.", tour: "На каком туре вы были?", other: "Другое / не помню", rating: "Ваша оценка", name: "Ваше имя", country: "Страна", review: "Ваш отзыв", placeholder: "Расскажите, как прошёл день…", btn: "Отправить отзыв в WhatsApp", note: "📷 Есть фото с тура? Прикрепите их в WhatsApp после отправки — мы их обожаем!", needText: "Сначала напишите пару слов и ваше имя :)", privacy: "Отправляя отзыв, вы передаёте его в наш WhatsApp-чат — данные никуда больше не передаются.", privacyLink: "Политика конфиденциальности" },
        es: { title: "¿Qué tal tu día en Bali con nosotros?", sub: "¡Gracias por viajar con SB Excursions! Deja una breve reseña — llega directo a nuestro WhatsApp, y puedes adjuntar tus fotos en el chat.", tour: "¿En qué tour estuviste?", other: "Otro / no recuerdo", rating: "Tu puntuación", name: "Tu nombre", country: "País", review: "Tu reseña", placeholder: "Cuéntanos cómo fue tu día…", btn: "Enviar reseña por WhatsApp", note: "📷 ¿Tienes fotos del tour? Adjúntalas en WhatsApp después de enviar — ¡nos encantan!", needText: "Primero escribe unas palabras y tu nombre :)", privacy: "Al enviar, tu reseña va a nuestro chat de WhatsApp — tus datos no se comparten con nadie más.", privacyLink: "Política de privacidad" },
        fr: { title: "Comment s’est passée votre journée à Bali avec nous ?", sub: "Merci d’avoir voyagé avec SB Excursions ! Laissez un court avis — il arrive directement sur notre WhatsApp, et vous pouvez joindre vos photos dans la conversation.", tour: "Quelle excursion avez-vous faite ?", other: "Autre / je ne sais plus", rating: "Votre note", name: "Votre prénom", country: "Pays", review: "Votre avis", placeholder: "Racontez-nous votre journée…", btn: "Envoyer l’avis via WhatsApp", note: "📷 Des photos de l’excursion ? Joignez-les dans WhatsApp après l’envoi — on adore !", needText: "Écrivez d’abord quelques mots et votre prénom :)", privacy: "En envoyant, votre avis part dans notre discussion WhatsApp — vos données ne sont partagées nulle part ailleurs.", privacyLink: "Politique de confidentialité" },
        zh: { title: "这次巴厘岛之行感觉如何？", sub: "感谢选择 SB Excursions！留下简短评价——它会直接发送到我们的 WhatsApp，照片可以在聊天中直接附上。", tour: "您参加了哪个行程？", other: "其他 / 不记得了", rating: "您的评分", name: "您的名字", country: "国家", review: "您的评价", placeholder: "分享您这一天的感受……", btn: "通过 WhatsApp 发送评价", note: "📷 有旅途照片？发送后直接在 WhatsApp 里附上——我们非常期待！", needText: "请先写几句话并填写名字 :)", privacy: "发送后，您的评价将进入我们的 WhatsApp 聊天——数据不会共享给任何第三方。", privacyLink: "隐私政策" }
      };
      var ALLOWED = { en: 1, ru: 1, es: 1, fr: 1, zh: 1 };
      var m = location.pathname.match(/\/bali\/(en|ru|es|fr|zh)\//) || [null, (new URLSearchParams(location.search).get('lang') || 'en')];
      var lang = ALLOWED[m[1]] === 1 ? m[1] : 'en';
      var t = I18N[lang];
      document.documentElement.lang = lang;
      ['Title','Sub','Tour','Rating','Name','Country','Review','Note'].forEach(function (k) {
        var el = document.getElementById('t' + k);
        if (el) el.textContent = t[k.toLowerCase()] || t[k.charAt(0).toLowerCase() + k.slice(1)];
      });
      document.getElementById('tTitle').textContent = t.title;
      document.getElementById('tSub').textContent = t.sub;
      document.getElementById('fText').placeholder = t.placeholder;
      document.getElementById('fSend').textContent = t.btn;
      var priv = document.getElementById('tPrivacy');
      priv.textContent = t.privacy + ' ';
      var privA = document.createElement('a');
      privA.href = '/bali/' + lang + '/privacy-policy';
      privA.target = '_blank'; privA.rel = 'noopener';
      privA.style.color = 'inherit';
      privA.textContent = t.privacyLink;
      priv.appendChild(privA);

      // список туров — из данных AI-планнера, всегда актуальный
      var sel = document.getElementById('fTour');
      var tours = (typeof SB_TOURS !== 'undefined') ? SB_TOURS : {};
      Object.keys(tours).forEach(function (key) {
        var o = document.createElement('option');
        o.value = key; o.textContent = tours[key].name;
        sel.appendChild(o);
      });
      var other = document.createElement('option');
      other.value = 'other'; other.textContent = t.other;
      sel.appendChild(other);

      var rating = 5;
      var stars = Array.prototype.slice.call(document.querySelectorAll('.star'));
      stars.forEach(function (btn) {
        btn.addEventListener('click', function () {
          rating = parseInt(btn.getAttribute('data-v'), 10);
          stars.forEach(function (b) { b.classList.toggle('on', parseInt(b.getAttribute('data-v'), 10) <= rating); });
        });
      });

      document.getElementById('fSend').addEventListener('click', function () {
        var name = (document.getElementById('fName').value || '').trim();
        var country = (document.getElementById('fCountry').value || '').trim();
        var text = (document.getElementById('fText').value || '').trim();
        if (!name || !text) { alert(t.needText); return; }
        var tourName = sel.value === 'other' ? t.other : (tours[sel.value] ? tours[sel.value].name : sel.value);
        var lines = [
          '⭐ REVIEW · ' + tourName + ' #' + sel.value,
          '★'.repeat(rating) + '☆'.repeat(5 - rating) + ' (' + rating + '/5)',
          name + (country ? ', ' + country : ''),
          '—',
          text
        ];
        window.open('https://wa.me/6285333685020?text=' + encodeURIComponent(lines.join('\n')), '_blank', 'noopener');
      });
    })();
  </script>
<script defer src="/_vercel/insights/script.js"></script>

</body>
</html>
